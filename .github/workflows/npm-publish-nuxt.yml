name: Publish Nuxt module to NPM

# Manual trigger only (publishes @davidabou/nuxt-icons from packages/nuxt).
on:
  workflow_dispatch:

# Publishing uses npm Trusted Publishing (OIDC): no NPM_TOKEN secret is needed,
# but this workflow must be registered as a trusted publisher on npmjs.com.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nuxt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Trusted Publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      # Generates the .nuxt type definitions needed by the type check
      - run: bun run dev:prepare
      - run: bun run test:types

      # Release candidates go to the "next" tag, everything else to "latest"
      - name: Pick the npm dist-tag
        id: tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-rc* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # npm runs the "prepack" script, which builds the module into dist/
      - run: npm publish --access public --tag ${{ steps.tag.outputs.tag }}
